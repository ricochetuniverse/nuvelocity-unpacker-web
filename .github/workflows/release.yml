name: Create GitHub release and publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'ricochetuniverse/nuvelocity-unpacker-web'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0'
          workloads: wasm-tools

      - name: Publish .NET app
        run: dotnet publish -c Release src/

      # GitHub releases
      - name: Create zip for GitHub release
        run: |
          zip -rj "dotnet-wasm.zip" web/public/dotnet/wwwroot/_framework/
          mkdir npm/dotnet/
          cp -r web/public/dotnet/wwwroot/_framework/ npm/dotnet/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dotnet-wasm.zip --draft --fail-on-no-commits --verify-tag

      # - name: Create release
      #   uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      #   with:
      #     files: |
      #       dotnet-wasm.zip

      # npm
      # https://docs.npmjs.com/trusted-publishers
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # cache: 'npm'
          # cache-dependency-path: npm/package-lock.json
          package-manager-cache: false # never use caching in release builds

      - name: Publish
        run: npm publish
        working-directory: ./npm
