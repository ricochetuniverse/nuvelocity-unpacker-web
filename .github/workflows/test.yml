name: Run .NET and Node.js tests

on:
  push:
    branches: ['master']

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # https://github.com/actions/setup-dotnet/releases/tag/v5.3.0
        with:
          dotnet-version: '8.0'
          workloads: wasm-tools-net8

      - name: Run tests (Debug)
        run: dotnet test -c Debug UnpackerTests/

      - name: Run tests (Release)
        run: dotnet test -c Release UnpackerTests/

      # Node.js
      # Do not split to another file, there is a dependency on .NET through `public/dotnet/wwwroot/_framework/dotnet.js`
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: ./web

      - name: Build website
        run: npm run build
        working-directory: ./web

      - name: Type-checking
        run: npm run tsc -- --build
        working-directory: ./web

      - name: Linting
        run: npm run lint
        working-directory: ./web

      - name: Check JavaScript code style
        run: npm run prettier -- --check
        working-directory: ./web
